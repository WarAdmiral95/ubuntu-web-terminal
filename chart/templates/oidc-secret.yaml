{{- $c := .Values.cognito }}
{{- if and .Values.ingress.enabled (eq $c.mode "oidc") (not $c.existingSecret) }}
{{- if not $c.clientSecret }}
{{- fail "cognito.mode=oidc requires cognito.clientSecret or cognito.existingSecret" }}
{{- end }}
# Read by the AWS Load Balancer Controller for the ALB authenticate-oidc action.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-oidc
type: Opaque
stringData:
  clientID: {{ $c.clientId | quote }}
  clientSecret: {{ $c.clientSecret | quote }}
{{- end }}
