{{- $c := .Values.imageCredentials }}
{{- if and (not $c.existingSecret) $c.username $c.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-image-pull
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict ($c.registry | default "https://index.docker.io/v1/") (dict "username" $c.username "password" $c.password "auth" (printf "%s:%s" $c.username $c.password | b64enc))) | toJson | quote }}
{{- end }}
