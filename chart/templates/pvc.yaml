{{- $p := .Values.persistence }}
{{- if and $p.enabled (not $p.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  {{- if $p.keepOnUninstall }}
  annotations:
    # helm uninstall leaves this PVC (and its data) in place.
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - {{ $p.accessMode }}
  {{- if $p.storageClass }}
  storageClassName: {{ $p.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
