{{- $c := .Values.cognito }}
{{- if and .Values.ingress.enabled (eq $c.mode "oidc") $c.controllerRbac.create }}
# Lets the AWS Load Balancer Controller read the OIDC client secret in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-alb-oidc-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-alb-oidc-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-alb-oidc-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ $c.controllerRbac.serviceAccountName }}
    namespace: {{ $c.controllerRbac.serviceAccountNamespace }}
{{- end }}
